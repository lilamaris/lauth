[versions]
assertj = "3.27.3"
jspecify = "1.0.0"
junit = "5.13.4"
mockito = "5.23.0"
lombok = "1.18.44"
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
springdoc-openapi = "3.0.2"
datasource-micrometer = "2.2.1"
bouncy-castle = "1.85.2"

[libraries]
## Base
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

## Base - Test
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-bom = { module = "org.mockito:mockito-bom", version.ref = "mockito" }
mockito-core = { module = "org.mockito:mockito-core" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter" }

## Base - Bouncy Castle
bc-jdk18on-bom = { module = "org.bouncycastle:bc-jdk18on-bom", version.ref = "bouncy-castle" }
bcprov-jdk18on = { module = "org.bouncycastle:bcprov-jdk18on" }
bcpkix-jdk18on = { module = "org.bouncycastle:bcpkix-jdk18on" }

## Spring Boot - Base
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-dependency-management-gradle-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-context = { module = "org.springframework:spring-context" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
tools-jackson-databind = { module = "tools.jackson.core:jackson-databind" }

## Spring Boot - Security
spring-security-core = { module = "org.springframework.security:spring-security-core" }
spring-security-web = { module = "org.springframework.security:spring-security-web" }
spring-security-jose = { module = "org.springframework.security:spring-security-oauth2-jose" }
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }

## Spring Boot - Persistence
spring-tx = { module = "org.springframework:spring-tx" }
jakarta-persistence-api = { module = "jakarta.persistence:jakarta.persistence-api" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
h2database = { module = "com.h2database:h2" }
postgresql = { module = "org.postgresql:postgresql" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-data-redis-test = { module = "org.springframework.boot:spring-boot-starter-data-redis-test" }

## Spring Boot - Web
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api" }
spring-web = { module = "org.springframework:spring-web" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc-openapi" }

## Spring Boot - Observability
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-opentelemetry = { module = "org.springframework.boot:spring-boot-starter-opentelemetry" }
datasource-micrometer-spring-boot = { module = "net.ttddyy.observation:datasource-micrometer-spring-boot", version.ref = "datasource-micrometer" }
datasource-micrometer-opentelemetry = { module = "net.ttddyy.observation:datasource-micrometer-opentelemetry", version.ref = "datasource-micrometer" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
